name: Downstream compatibility
on:
  pull_request:
    branches: [fork, fork-next]
  push:
    branches: [fork, fork-next]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - uses: ./.github/actions/downstream-check
