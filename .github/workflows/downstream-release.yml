name: Downstream Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Expected exact version for a retry (X.Y.Z-fork.N)"
        required: false
        type: string

permissions:
  contents: read
  id-token: none

jobs:
  preflight:
    name: Validate downstream release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      status: ${{ steps.existing.outputs.status }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.release_tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout downstream main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - id: commit
        name: Verify release commit and remotes
        shell: bash
        env:
          EVENT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          upstream_repository="$(
            node scripts/downstream-release-state.ts validate --github-output
            grep '^repository=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-
          )"
          if [[ "$GITHUB_REPOSITORY" == "$upstream_repository" ]]; then
            echo "The downstream release workflow cannot publish from the upstream repository." >&2
            exit 1
          fi

          expected_origin="https://github.com/${GITHUB_REPOSITORY}.git"
          origin_url="$(git remote get-url origin)"
          if [[ "$origin_url" != "$expected_origin" && "$origin_url" != "${expected_origin%.git}" ]]; then
            echo "Refusing to release: origin is '$origin_url', expected '$expected_origin'." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          git fetch --tags --no-force origin
          sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [[ -n "$EVENT_SHA" && "$sha" != "$EVENT_SHA" ]]; then
            echo "Release checkout $sha does not match push commit $EVENT_SHA." >&2
            exit 1
          fi
          if [[ -n "$EVENT_SHA" ]] && ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "Push commit $sha is no longer on current origin/main." >&2
            exit 1
          fi
          if [[ -z "$EVENT_SHA" && "$sha" != "$main_sha" ]]; then
            echo "Release checkout $sha is not current origin/main $main_sha." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: release
        name: Resolve and validate fork release version
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          target_tags="$(git tag --points-at "$RELEASE_SHA" --list 'v*-fork.*')"
          baseline_sha="$(
            git log \
              --first-parent \
              --max-count=1 \
              --format=%H \
              "$RELEASE_SHA" \
              -- .github/upstream-release.json .github/workflows/downstream-release.yml
          )"
          if [[ -z "$baseline_sha" ]]; then
            echo "Could not find the upstream baseline commit for $RELEASE_SHA." >&2
            exit 1
          fi
          baseline_position="$(
            git rev-list \
              --first-parent \
              --count \
              "${baseline_sha}^..${RELEASE_SHA}"
          )"
          upstream_tag="$(node -p "require('./.github/upstream-release.json').tag")"
          upstream_base="${upstream_tag#v}"
          existing_tags="$(
            while IFS= read -r candidate_tag; do
              candidate_sha="$(git rev-list -n 1 "$candidate_tag")"
              if git merge-base --is-ancestor "$baseline_sha" "$candidate_sha"; then
                printf '%s\n' "$candidate_tag"
              fi
            done < <(git tag --list "v${upstream_base}-fork.*")
          )"
          baseline_revision=1
          while IFS= read -r baseline_tag; do
            candidate_revision="${baseline_tag##*.}"
            if [[ "$candidate_revision" =~ ^[1-9][0-9]*$ ]] &&
              (( candidate_revision > baseline_revision )); then
              baseline_revision="$candidate_revision"
            fi
          done < <(
            git tag \
              --points-at "$baseline_sha" \
              --list "v${upstream_base}-fork.*"
          )
          release_revision="$((baseline_revision + baseline_position - 1))"
          args=(
            resolve-release
            --state .github/upstream-release.json
            --existing-tags "$existing_tags"
            --target-tags "$target_tags"
            --revision "$release_revision"
            --github-output
          )
          if [[ -n "$REQUESTED_VERSION" ]]; then
            args+=(--version "$REQUESTED_VERSION")
          fi
          node scripts/downstream-release-state.ts "${args[@]}"

          version="$(grep '^version=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"
          node scripts/update-release-package-versions.ts "$version"
          vp install --lockfile-only --ignore-scripts
          node scripts/downstream-release-state.ts validate-release \
            --state .github/upstream-release.json \
            --root "$GITHUB_WORKSPACE" \
            --version "$version"
          vp install --frozen-lockfile --ignore-scripts

      - id: existing
        name: Check immutable tag and release state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          status="new"
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/downstream/${RELEASE_TAG}"
            tagged_sha="$(git rev-parse "refs/tags/downstream/${RELEASE_TAG}^{commit}")"
            if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
              echo "Immutable tag $RELEASE_TAG already points to $tagged_sha, not $RELEASE_SHA." >&2
              exit 1
            fi
            status="retry"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$status" != "retry" ]]; then
              echo "Release $RELEASE_TAG exists without its required immutable tag." >&2
              exit 1
            fi
            status="already-released"
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Resolved release state: $status"

  build_windows:
    name: Build Windows x64 NSIS
    needs: preflight
    if: needs.preflight.outputs.status != 'already-released'
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Prepare resolved package versions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"
          vp install --lockfile-only --ignore-scripts

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Prepare Azure Trusted Signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"
          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          if ($requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "Azure Trusted Signing disabled; credentials are incomplete."
            exit 0
          }

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet; continuing with installed providers. $($_.Exception.Message)"
          }
          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop
          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          args=(
            --platform win
            --target nsis
            --arch x64
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
          }

          if has_all \
            "$AZURE_TENANT_ID" \
            "$AZURE_CLIENT_ID" \
            "$AZURE_CLIENT_SECRET" \
            "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
            "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
            "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
            "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
            echo "Windows signing enabled (Azure Trusted Signing)."
            args+=(--signed)
          else
            echo "Windows signing disabled (credentials are incomplete)."
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect and verify release assets
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.exe" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          exe=(release-publish/*.exe)
          blockmap=(release-publish/*.blockmap)
          if (( ${#exe[@]} == 0 || ${#blockmap[@]} == 0 )); then
            echo "The Windows release must contain an installer and blockmap." >&2
            exit 1
          fi
          if [[ ! -f release-publish/latest.yml ]]; then
            echo "The Windows release must contain latest.yml." >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
            import fs from "node:fs";
            const manifest = fs.readFileSync("release-publish/latest.yml", "utf8");
            const version = manifest.match(/^version:\s*['"]?([^'"\s#]+)['"]?\s*$/m)?.[1];
            if (version !== process.env.EXPECTED_VERSION) {
              throw new Error(`latest.yml version mismatch: ${version}`);
            }
          NODE

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: downstream-desktop-win-x64
          path: release-publish/*
          if-no-files-found: error

  publish:
    name: Publish immutable GitHub Release
    needs: [preflight, build_windows]
    if: needs.preflight.outputs.status != 'already-released' && needs.build_windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - name: Download Windows release assets
        uses: actions/download-artifact@v8
        with:
          name: downstream-desktop-win-x64
          path: release-assets

      - name: Verify and publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(release-assets/*.exe)
          blockmaps=(release-assets/*.blockmap)
          manifests=(release-assets/*.yml)
          if (( ${#installers[@]} == 0 || ${#blockmaps[@]} == 0 || ${#manifests[@]} == 0 )); then
            echo "Missing required Windows release assets." >&2
            exit 1
          fi
          if [[ ! -f release-assets/latest.yml ]]; then
            echo "Missing release-assets/latest.yml." >&2
            exit 1
          fi

          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/downstream/${RELEASE_TAG}"
            tagged_sha="$(git rev-parse "refs/tags/downstream/${RELEASE_TAG}^{commit}")"
            if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
              echo "Immutable tag $RELEASE_TAG points to $tagged_sha, not $RELEASE_SHA." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "T3 Code $RELEASE_TAG"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" \
              release-assets/*.exe \
              release-assets/*.blockmap \
              release-assets/*.yml \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "T3 Code $RELEASE_TAG" \
              --generate-notes \
              --latest=false
          fi

          latest_tag="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-fork\.[1-9][0-9]*$' |
              sort -V |
              tail -n 1
          )"
          latest_release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${latest_tag}" --jq '.id'
          )"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${latest_release_id}" \
            -f make_latest=true >/dev/null
          echo "Marked highest fork release ${latest_tag} as latest."
