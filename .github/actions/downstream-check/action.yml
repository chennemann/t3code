name: Validate release
description: Check the release state and changed behavior.
runs:
  using: composite
  steps:
    - name: Check release state
      shell: bash
      run: |
        set -euo pipefail
        node scripts/downstream-release-state.ts validate

    - name: Typecheck affected packages
      shell: bash
      run: |
        set -euo pipefail
        for package in @t3tools/source-control-core @t3tools/source-control-github @t3tools/contracts @t3tools/shared @t3tools/provider-core @t3tools/provider-acp-registry @t3tools/client-runtime t3 @t3tools/web @t3tools/mobile @t3tools/desktop @t3tools/scripts; do
          vp run --filter "$package" typecheck
        done

    # Fork browser tests run in headless Chromium, set up as upstream's CI does.
    - name: Resolve Playwright version
      id: playwright_version
      shell: bash
      run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Chromium
      id: chromium_cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

    - name: Install Chromium for web browser tests
      if: steps.chromium_cache.outputs.cache-hit != 'true'
      shell: bash
      run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

    - name: Install missing Chromium system dependencies
      shell: bash
      run: |
        browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
        test -n "$browser"
        if ldd "$browser" | grep '=> not found'; then
          node apps/web/node_modules/playwright/cli.js install-deps chromium
        fi

    - name: Lint and test changed behavior
      shell: bash
      run: |
        set -euo pipefail
        base="$(git rev-parse HEAD^)"
        mapfile -t sources < <(git diff --name-only --diff-filter=ACMR "$base" -- '*.ts' '*.tsx')
        if (( ${#sources[@]} )); then vp lint "${sources[@]}"; fi
        mapfile -t tests < <(git diff --name-only --diff-filter=ACMR "$base" -- '*.test.ts' '*.test.tsx')
        if (( ${#tests[@]} )); then vp test run "${tests[@]}"; fi

    - name: Build and boot the web client
      shell: bash
      run: |
        set -euo pipefail
        vp run --filter @t3tools/web build
        node apps/web/scripts/verify-built-boot.ts
